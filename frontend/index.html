<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)" />
    <!-- The theme follows the device until the owner picks one; set before the first paint, with the bar colour of a
         picked theme (the grounds of style.css). App.vue keeps both in step afterwards. -->
    <script>(function () {
      var chosen; try { chosen = localStorage.getItem('affiche.theme') } catch (e) {}
      var picked = chosen === 'clair' || chosen === 'sombre', theme = picked ? chosen : matchMedia('(prefers-color-scheme: light)').matches ? 'clair' : 'sombre'
      document.documentElement.dataset.theme = theme
      if (picked) document.querySelectorAll('meta[name=theme-color]').forEach(function (meta) { meta.content = theme === 'clair' ? '#f4f1ec' : '#100f0e' })
    })()</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Affiche IA — Atelier</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
