[project]
name = "affiche"
version = "0.1.0"
# <3.14: rembg (added later) declares >=3.11,<3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
