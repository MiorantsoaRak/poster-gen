[project]
name = "affiche"
version = "0.1.0"
# <3.14: set for rembg 2.0.74 (<3.14); 2.0.87 declares <4.0, but only 3.12 is tested here.
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "fonttools>=4.68.0",
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "rembg[cpu]>=2.0.87",
    "scipy>=1.18.1",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not rembg'"
markers = ["rembg: runs the real rembg model on CPU (slow); opt in with -m rembg"]
